[auth]
allowed_redirect_urls = ["http://192.168.0.14:3000", "http://localhost:3000"]
require_email_verification = true
verify_email_method = "code"
reset_password_method = "code"
disable_signup = true

[auth.password]
min_length = 8
require_number = false
require_lowercase = false
require_uppercase = false
require_special_char = false

[auth.smtp]
enabled = false
host = ""
port = 465
username = ""
sender_email = ""
sender_name = ""
min_interval_seconds = 60

[storage]
max_file_size_mb = 15

[realtime]
retention_days = 0

[schedules]
retention_days = 7
