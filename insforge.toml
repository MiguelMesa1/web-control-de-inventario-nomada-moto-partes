[auth]
allowed_redirect_urls = ["http://localhost:3000", "http://192.168.0.14:3000"]
require_email_verification = true
verify_email_method = "code"
reset_password_method = "code"
disable_signup = true

[auth.password]
min_length = 12
require_number = true
require_lowercase = true
require_uppercase = true
require_special_char = true

[storage]
max_file_size_mb = 15
